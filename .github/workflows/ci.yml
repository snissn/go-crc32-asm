name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23.x", "stable"]
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-13
          - macos-14
          - windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Environment
        run: go env GOOS GOARCH GOVERSION

      - name: Test
        run: go test ./...

      - name: Bench Smoke
        run: go test -run '^$' -bench 'Benchmark(ChecksumIEEE|GomapHashTournamentSlice)$' -benchtime=100ms -count=1

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Compile tests
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go test -c -o test-${{ matrix.target.goos }}-${{ matrix.target.goarch }} ./...
