name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            go: "1.23.x"
          - os: ubuntu-24.04
            go: stable
          - os: macos-14
            go: stable
          - os: windows-2022
            go: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Environment
        run: go env GOOS GOARCH GOVERSION

      - name: Test
        run: go test ./...

      - name: Bench Smoke
        run: go test -run '^$' -bench 'Benchmark(ChecksumIEEE|GomapHashTournamentSlice)$' -benchtime=100ms -count=1

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Compile tests
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64
          do
            GOOS=${target%/*} GOARCH=${target#*/} go test -c ./... -o /dev/null
          done
